version: 2

models:
  - name: stg_yellow_trips
    description: "One row per cleaned trip, columns renamed only. Reversals are kept; the marts decide."
    columns:
      - name: trip_id
        data_tests:
          - unique
          - not_null
      - name: pickup_at
        data_tests:
          - not_null
      - name: is_reversal
        data_tests:
          - not_null
